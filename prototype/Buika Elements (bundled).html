function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*'); } catch {}
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch {}
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo } = React;

function Reveal({ children, delay = 0, as: As = "div", className = "", ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    if (typeof IntersectionObserver === "undefined") { setShown(true); return; }
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          setTimeout(() => setShown(true), delay);
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, [delay]);
  return <As ref={ref} className={`reveal ${shown ? "in" : ""} ${className}`} {...rest}>{children}</As>;
}

function Wordmark({ size = 20, onDark = false }) {
  return (
    <span style={{
      fontFamily: "var(--serif)",
      fontWeight: 400,
      fontSize: size,
      letterSpacing: "0.08em",
      color: onDark ? "var(--paper)" : "var(--ink)",
      textTransform: "uppercase",
      display: "inline-flex",
      alignItems: "center",
      gap: "0.5em",
      whiteSpace: "nowrap",
    }}>
      <span style={{
        display: "inline-block",
        width: "0.32em", height: "0.32em",
        background: "var(--signal)",
        marginTop: "0.08em",
        flexShrink: 0,
      }} />
      <span style={{ whiteSpace: "nowrap" }}>Buika Elements</span>
    </span>
  );
}

function TopNav({ route, setRoute, lang, setLang, onOpenContact, copy }) {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  useEffect(() => {
    document.body.classList.toggle("no-scroll", mobileOpen);
  }, [mobileOpen]);

  const items = [
    { key: "home", label: copy.nav.home },
    { key: "services", label: copy.nav.services },
    { key: "about", label: copy.nav.about },
    { key: "resources", label: copy.nav.resources },
  ];

  const navStyle = {
    position: "fixed", top: 0, left: 0, right: 0, zIndex: 40,
    background: "color-mix(in srgb, var(--paper) 92%, transparent)",
    backdropFilter: "blur(12px) saturate(140%)",
    WebkitBackdropFilter: "blur(12px) saturate(140%)",
    borderBottom: scrolled ? "1px solid var(--stone)" : "1px solid transparent",
    transition: "border-color 200ms var(--ease)",
  };

  return (
    <>
      <header style={navStyle}>
        <div className="container" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", height: 72 }}>
          <a href="#home" onClick={(e) => { e.preventDefault(); setRoute("home"); }} aria-label="Buika Elements home">
            <Wordmark size={18} />
          </a>
          <nav className="nav-desktop" style={{ display: "flex", alignItems: "center", gap: 36 }}>
            {items.map(it => {
              const active = route === it.key;
              return (
                <a key={it.key} href={`#${it.key}`}
                   onClick={(e) => { e.preventDefault(); setRoute(it.key); }}
                   style={{
                     fontSize: 14, fontWeight: active ? 500 : 400,
                     color: active ? "var(--ink)" : "var(--ink-muted)",
                     paddingBottom: 4,
                     borderBottom: active ? "1px solid var(--ink)" : "1px solid transparent",
                     transition: "color 200ms var(--ease), border-color 200ms var(--ease)",
                   }}>
                  {it.label}
                </a>
              );
            })}
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, marginLeft: 12 }}>
              <button onClick={() => setLang("en")} style={{
                color: lang === "en" ? "var(--ink)" : "var(--ink-muted)",
                fontWeight: lang === "en" ? 500 : 400,
              }}>EN</button>
              <span style={{ color: "var(--stone)" }}>/</span>
              <button onClick={() => setLang("es")} style={{
                color: lang === "es" ? "var(--ink)" : "var(--ink-muted)",
                fontWeight: lang === "es" ? 500 : 400,
              }}>ES</button>
            </div>
          </nav>
          <button className="nav-hamburger"
                  onClick={() => setMobileOpen(o => !o)}
                  aria-label="Menu"
                  aria-expanded={mobileOpen}
                  style={{ display: "none", width: 40, height: 40, alignItems: "center", justifyContent: "center" }}>
            <div style={{ width: 20, height: 12, position: "relative" }}>
              <div style={{
                position: "absolute", left: 0, right: 0, height: 1, background: "var(--ink)",
                top: mobileOpen ? 6 : 0,
                transform: mobileOpen ? "rotate(45deg)" : "none",
                transition: "all 200ms var(--ease)",
              }} />
              <div style={{

function ContactModal({ open, onClose, copy }) {
  const [form, setForm] = useState({ name: "", company: "", email: "", brief: "", country: "", consent: false });
  const [errors, setErrors] = useState({});
  const [submitted, setSubmitted] = useState(false);

  useEffect(() => {
    document.body.classList.toggle("no-scroll", open);
    if (!open) { setSubmitted(false); setErrors({}); }
  }, [open]);

  useEffect(() => {
    const onKey = e => { if (e.key === "Escape" && open) onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, onClose]);

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = true;
    if (!form.company.trim()) e.company = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = true;
    if (!form.brief.trim() || form.brief.trim().length < 10) e.brief = true;
    if (!form.consent) e.consent = true;
    return e;
  };

  const submit = (e) => {
    e.preventDefault();
    const es = validate();
    setErrors(es);
    if (Object.keys(es).length === 0) setSubmitted(true);
  };

  if (!open) return null;

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 60,
      background: "rgba(10,10,11,0.55)",
      display: "flex", alignItems: "flex-end", justifyContent: "center",
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "var(--paper)", width: "100%", maxWidth: 720,
        maxHeight: "92vh", overflowY: "auto",
        padding: "48px clamp(24px, 4vw, 56px) 56px",
        animation: "slideUp 300ms var(--ease)",
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32 }}>
          <div className="eyebrow">{copy.contactModal.eyebrow}</div>
          <button onClick={onClose} aria-label={copy.contactModal.close}
                  style={{ fontSize: 13, color: "var(--ink-muted)", display: "inline-flex", gap: 8, alignItems: "center" }}>
            <span style={{ fontSize: 18, lineHeight: 1 }}>×</span> {copy.contactModal.close}
          </button>
        </div>

        {submitted ? (
          <div style={{ paddingBlock: 40 }}>
            <div className="signal-rule" style={{ marginBottom: 24 }} />
            <h2 className="h2" style={{ marginBottom: 16 }}>{copy.contactModal.success}</h2>
            <p className="lede text-ink-muted">{copy.contactModal.sub}</p>
          </div>
        ) : (
          <>
            <h2 className="h2" style={{ marginBottom: 16 }}>{copy.contactModal.head}</h2>
            <p className="lede text-ink-muted" style={{ marginBottom: 40 }}>{copy.contactModal.sub}</p>
            <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 28 }} noValidate>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }} className="modal-row">
                <div className={`field ${errors.name ? "err" : ""}`}>
                  <label>{copy.contactModal.name} <span className="req">*</span></label>
                  <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
                </div>
                <div className={`field ${errors.company ? "err" : ""}`}>
                  <label>{copy.contactModal.company} <span className="req">*</span></label>
                  <input value={form.company} onChange={e => setForm({ ...form, company: e.target.value })} />
                </div>
              </div>
              <div className={`field ${errors.email ? "err" : ""}`}>
                <label>{copy.contactModal.email} <span className="req">*</span></label>
                <input type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
                {errors.email && <span className="err-msg">Please enter a valid email address.</span>}
              </div>
              <div className={`field ${errors.brief ? "err" : ""}`}>
                <label>{copy.contactModal.brief} <span className="req">*</span></label>
                <textarea rows={4} placeholder={copy.contactModal.briefPh}
                          value={form.brief} onChange={e => setForm({ ...form, brief: e.target.value })} />
              </div>
              <div className="field">
                <label>{copy.contactModal.country}</label>
                <input value={form.country} onChange={e => setForm({ ...form, country: e.target.value })} />
              </div>
              <label className={`consent ${errors.consent ? "err" : ""}`}>
                <input type="checkbox" checked={form.consent} onChange={e => setForm({ ...form, consent: e.target.checked })} />
                <span>{copy.contactModal.consent}</span>
              </label>
              <div>
                <button type="submit" className="btn btn-primary">
                  {copy.contactModal.submit} <span className="arr">→</span>
                </button>
              </div>
            </form>
          </>
        )}
      </div>
      <style>{`
        @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (max-width: 640px) { .modal-row { grid-template-columns: 1fr !important; } }
      `}</style>
    </div>
  );
}

Object.assign(window, { Reveal, Wordmark, TopNav, Footer, CredibilityBar, Statement, CtaBand, Placeholder, ContactModal });

<script type="text/babel" data-presets="env,react">
function ResourcesPage({ copy, onCta, lang, setRoute }) {
  const [filter, setFilter] = React.useState(copy.resources.filters[0]);
  const [email, setEmail] = React.useState("");
  const [subscribed, setSubscribed] = React.useState(false);
  const [emailErr, setEmailErr] = React.useState(false);

  React.useEffect(() => { setFilter(copy.resources.filters[0]); }, [lang]);

  const filtered = React.useMemo(() => {
    const f = filter;
    const all = copy.resources.filters[0];
    if (f === all) return copy.resources.articles;
    return copy.resources.articles.filter(a => {
      if (f === "Essays" || f === "Ensayos") return a.category === "Essay" || a.category === "Ensayo";
      if (f === "Whitepapers") return a.category === "Whitepaper";
      if (f === "Field notes" || f === "Notas de campo") return a.category === "Field note" || a.category === "Nota de campo";
      return true;
    });
  }, [filter, copy]);

  const submitNewsletter = (e) => {
    e.preventDefault();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setEmailErr(true); return; }
    setEmailErr(false);
    setSubscribed(true);
  };

  return (
    <>
      <section style={{ paddingTop: 180, paddingBottom: 72 }}>
        <div className="container">
          <div style={{ display: "grid", gridTemplateColumns: "repeat(12, 1fr)", gap: 24 }}>

              {copy.resources.filters.map(f => (
                <button key={f} onClick={() => setFilter(f)}
                  style={{
                    fontSize: 13, padding: "8px 16px",
                    color: filter === f ? "var(--paper)" : "var(--ink)",

              {subscribed ? (
                <div style={{ fontFamily: "var(--mono)", fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--signal)" }}>
                  ✓ {lang === "es" ? "Suscrito. Te hemos enviado un email de confirmación." : "Subscribed. Check your inbox for a confirmation email."}
                </div>
              ) : (
                <form onSubmit={submitNewsletter} style={{ display: "flex", gap: 0, alignItems: "stretch", borderBottom: "1px solid var(--ink)" }}>
                  <input type="email" value={email} onChange={e => { setEmail(e.target.value); setEmailErr(false); }}
                         placeholder={copy.resources.newsletter.placeholder}
                         style={{
                           flex: 1, border: 0, background: "transparent",
                           padding: "14px 0", fontSize: 17, outline: "none",
                           color: emailErr ? "#A33" : "var(--ink)",
                         }} />
                  <button type="submit" style={{
                    background: "var(--ink)", color: "var(--paper)",
                    padding: "0 24px", fontSize: 14, fontWeight: 500,
                    display: "inline-flex", alignItems: "center", gap: 8,
                  }}>
                    {copy.resources.newsletter.cta} <span>→</span>
                  </button>
                </form>
              )}
              {emailErr && <div style={{ color: "#A33", fontSize: 13, marginTop: 8 }}>Please enter a valid email.</div>}
            </div>
          </div>
        </div>
        <style>{`@media (max-width: 900px) { .nl-grid { grid-template-columns: 1fr !important; } }`}</style>
      </section>

      <style>{`@media (max-width: 760px) {
        .res-row { grid-template-columns: 1fr !important; gap: 12px !important; padding: 28px 0 !important; }
        .res-row > div:last-child { text-align: left !important; }
      }`}</style>
    </>
  );
}

Object.assign(window, { ResourcesPage });
</script>

<script type="text/babel" data-presets="env,react">
function slugify(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 80);
}

function ResourceDetailPage({ copy, lang, slug, setRoute, onCta }) {
  const article = React.useMemo(() => {
    const list = copy.resources.articles;
    return list.find(a => slugify(a.title) === slug) || list[0];
  }, [slug, copy]);

  const isWp = article.category === "Whitepaper";
  const isGated = !!article.gated;

  const [email, setEmail] = React.useState("");
  const [consent, setConsent] = React.useState(false);
  const [errs, setErrs] = React.useState({});
  const [delivered, setDelivered] = React.useState(false);

  const submit = (e) => {
    e.preventDefault();
    const next = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) next.email = true;
    if (!consent) next.consent = true;
    setErrs(next);
    if (Object.keys(next).length === 0) setDelivered(true);
  };

  const related = copy.resources.articles
    .filter(a => a.category === article.category && a.title !== article.title)
    .slice(0, 2);

  const placeholderBody = lang === "es"
    ? [
        "Esta página es una vista previa. El cuerpo del documento se gestionará desde Sanity una vez integrado el CMS.",
        "Mientras tanto, el resumen y los metadatos provienen del documento de copy. La descarga del PDF está sujeta a verificación de email; el enlace se envía a tu bandeja, no se sirve directamente.",
      ]
    : [
        "This page is a preview. The document body will be managed in Sanity once the CMS is wired up.",
        "Meanwhile, the abstract and metadata come from the copy document. PDF downloads are gated by email verification; the link is sent to your inbox rather than served directly.",
      ];

  return (
    <>
      <section style={{ paddingTop: 180, paddingBottom: 64 }}>
        <div className="container">
          <button onClick={() => setRoute("resources")}
                  className="mono"
                  style={{
                    fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase",
                    color: "var(--ink-muted)", marginBottom: 48, cursor: "pointer",
                    display: "inline-flex", alignItems: "center", gap: 8,
                  }}>
            ← {lang === "es" ? "Recursos" : "Resources"}
          </button>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(12, 1fr)", gap: 24 }}>
            <div style={{ gridColumn: "2 / span 10" }} className="rd-head">
              <div className="eyebrow" style={{ marginBottom: 32, color: isWp ? "var(--signal)" : undefined }}>
                <span>{article.category}</span>
                <span style={{ margin: "0 12px", color: "var(--ink-faint)" }}>·</span>
                <span style={{ color: "var(--ink-muted)" }}>{article.date}</span>
              </div>

              <h1 className="h1" style={{ marginBottom: 40, maxWidth: 1100 }}>{article.title}</h1>

              <p className="lede" style={{ maxWidth: 720, color: "var(--ink-muted)" }}>{article.excerpt}</p>

              <dl style={{
                display: "grid", gridTemplateColumns: "repeat(4, auto)", gap: "12px 48px",
                margin: "56px 0 0", padding: 0,
                borderTop: "1px solid var(--stone)", paddingTop: 24,
              }} className="rd-meta">
                <div>
                  <dt className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginBottom: 4 }}>
                    {lang === "es" ? "Autor" : "Author"}
                  </dt>
                  <dd style={{ margin: 0, fontSize: 14 }}>Simon Buika</dd>
                </div>
                <div>
                  <dt className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginBottom: 4 }}>
                    {lang === "es" ? "Formato" : "Format"}
                  </dt>
                  <dd style={{ margin: 0, fontSize: 14 }}>{article.read}</dd>
                </div>
                <div>
                  <dt className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginBottom: 4 }}>
                    {lang === "es" ? "Idiomas" : "Languages"}
                  </dt>
                  <dd style={{ margin: 0, fontSize: 14 }}>{article.lang}</dd>
                </div>
                <div>
                  <dt className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginBottom: 4 }}>
                    {lang === "es" ? "Publicado" : "Published"}
                  </dt>
                  <dd style={{ margin: 0, fontSize: 14 }}>{article.date}</dd>
                </div>
              </dl>
            </div>
          </div>
        </div>
        <style>{`
          @media (max-width: 760px) {
            .rd-head { grid-column: 1 / -1 !important; }
            .rd-meta { grid-template-columns: repeat(2, auto) !important; gap: 20px 32px !important; }
          }
        `}</style>
      </section>

      <section style={{ paddingBottom: 96 }}>
        <div className="container">
          <div style={{ display: "grid", gridTemplateColumns: "repeat(12, 1fr)", gap: 24 }}>
            <div style={{ gridColumn: "2 / span 7" }} className="rd-body">
              {placeholderBody.map((p, i) => (
                <p key={i} className="body" style={{ marginBottom: 24, color: "var(--ink-muted)", maxWidth: 680 }}>{p}</p>
              ))}

              <div style={{
                marginTop: 48, padding: "20px 24px",
                borderLeft: "2px solid var(--signal)", background: "var(--stone-soft)",
              }}>
                <div className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--signal)", marginBottom: 6 }}>
                  {lang === "es" ? "Marcador de posición" : "Placeholder"}
                </div>
                <div style={{ fontSize: 14, color: "var(--ink-muted)" }}>
                  {lang === "es"
                    ? "El contenido completo se servirá desde Sanity. Esquema y consultas GROQ ya definidos."
                    : "Full body will be served from Sanity. Schema and GROQ queries already defined."}
                </div>
              </div>
            </div>

            <aside style={{ gridColumn: "10 / span 3" }} className="rd-aside">
              <div style={{ position: "sticky", top: 120 }}>
                {isGated ? (
                  delivered ? (
                    <div style={{ padding: 24, border: "1px solid var(--stone)" }}>
                      <div className="signal-rule" style={{ marginBottom: 16 }} />
                      <div className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--signal)", marginBottom: 12 }}>
                        ✓ {lang === "es" ? "Enlace enviado" : "Link sent"}
                      </div>
                      <p style={{ fontSize: 14, lineHeight: 1.55, color: "var(--ink-muted)", margin: 0 }}>
                        {lang === "es"
                          ? `Hemos enviado el PDF a ${email}. El enlace caduca en 24 horas.`
                          : `We've emailed the PDF to ${email}. The link expires in 24 hours.`}
                      </p>
                    </div>
                  ) : (
                    <form onSubmit={submit} style={{ padding: 24, border: "1px solid var(--ink)" }} noValidate>
                      <div className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--signal)", marginBottom: 12 }}>
                        ↓ {lang === "es" ? "Descarga gratuita" : "Free download"}
                      </div>
                      <h4 className="h4" style={{ marginBottom: 8 }}>
                        {lang === "es" ? "Solicita el PDF" : "Request the PDF"}
                      </h4>
                      <p style={{ fontSize: 13, color: "var(--ink-muted)", marginBottom: 24, lineHeight: 1.5 }}>
                        {lang === "es"
                          ? "Te enviaremos el enlace por email. Sin listas de marketing automáticas."
                          : "We'll email you the link. No automatic marketing lists."}
                      </p>

                      <div className={"field" + (errs.email ? " err" : "")} style={{ marginBottom: 16 }}>
                        <label htmlFor="rd-email">{lang === "es" ? "Email profesional" : "Work email"} <span className="req">*</span></label>
                        <input id="rd-email" type="email" value={email}
                               onChange={e => { setEmail(e.target.value); setErrs(p => ({ ...p, email: false })); }} />
                        {errs.email && <div className="err-msg">{lang === "es" ? "Email no válido." : "Please enter a valid email."}</div>}
                      </div>

                      <label className="consent" style={{ marginBottom: 20 }}>
                        <input type="checkbox" checked={consent}
                               onChange={e => { setConsent(e.target.checked); setErrs(p => ({ ...p, consent: false })); }} />
                        <span>
                          {lang === "es"
                            ? "Acepto recibir el PDF y comunicaciones ocasionales sobre este tema."
                            : "I agree to receive the PDF and occasional related correspondence."}
                        </span>
                      </label>
                      {errs.consent && <div className="err-msg" style={{ marginTop: -12, marginBottom: 16 }}>{lang === "es" ? "Requerido." : "Required."}</div>}

                      <button type="submit" className="btn btn-primary" style={{ width: "100%", justifyContent: "center" }}>
                        {lang === "es" ? "Enviar enlace" : "Send link"} <span className="arr">→</span>
                      </button>
                    </form>
                  )
                ) : (
                  <div style={{ padding: 24, border: "1px solid var(--stone)" }}>
                    <div className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-muted)", marginBottom: 12 }}>
                      {lang === "es" ? "Lectura abierta" : "Open reading"}
                    </div>
                    <p style={{ fontSize: 13, color: "var(--ink-muted)", margin: 0, lineHeight: 1.5 }}>
                      {lang === "es" ? "Sin descarga. Lectura completa arriba." : "No download. Full read above."}
                    </p>
                  </div>
                )}
              </div>
            </aside>
          </div>
        </div>
        <style>{`
          @media (max-width: 900px) {
            .rd-body { grid-column: 1 / -1 !important; }
            .rd-aside { grid-column: 1 / -1 !important; }
            .rd-aside > div { position: static !important; }
          }
        `}</style>
      </section>

      {related.length > 0 && (
        <section style={{ paddingBlock: 96, borderTop: "1px solid var(--stone)" }}>
          <div className="container">
            <div className="eyebrow" style={{ marginBottom: 40 }}>
              {lang === "es" ? "Lectura relacionada" : "Related reading"}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 48 }} className="rd-related">
              {related.map((r, i) => (
                <a key={i} onClick={(e) => { e.preventDefault(); setRoute("resource:" + slugify(r.title)); }}
                   href="#" style={{ display: "block", paddingTop: 24, borderTop: "1px solid var(--ink)" }}>
                  <div className="mono" style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: r.category === "Whitepaper" ? "var(--signal)" : "var(--ink-muted)", marginBottom: 12 }}>
                    {r.category} · {r.date}
                  </div>
                  <h3 className="serif" style={{ fontSize: "clamp(20px, 1.8vw, 24px)", lineHeight: 1.25, letterSpacing: "-0.005em", marginBottom: 12, textWrap: "balance" }}>
                    {r.title}
                  </h3>
                  <p style={{ fontSize: 14, lineHeight: 1.55, color: "var(--ink-muted)", margin: 0, maxWidth: 480 }}>{r.excerpt}</p>
                </a>
              ))}
            </div>
          </div>
          <style>{`@media (max-width: 760px) { .rd-related { grid-template-columns: 1fr !important; gap: 32px !important; } }`}</style>
        </section>
      )}
    </>
  );
}

Object.assign(window, { ResourceDetailPage, slugify });
</script>

<!-- ═════════════════════════════════════════════════════════════════════
     INLINED: app.jsx

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = {
  "serifFamily": "Source Serif 4",
  "paperWarmth": 2,
  "signalHue": "#0F2A5C",
  "heroVariant": "standard"
};

const SERIF_STACKS = {
  "Source Serif 4": `"Source Serif 4", "EB Garamond", Georgia, serif`,
  "EB Garamond":    `"EB Garamond", Georgia, serif`,
  "Instrument Serif": `"Instrument Serif", "EB Garamond", Georgia, serif`,
};

const PAPER_WARMTH_MAP = [
  { paper: "#F6F4EF", pure: "#FCFBF7", stone: "#E6E2D9", soft: "#EFEBE1" },
  { paper: "#F5F2EA", pure: "#FBF9F3", stone: "#E4DFD5", soft: "#EDE9DD" },
  { paper: "#F3EFE6", pure: "#FBF9F3", stone: "#E2DDD1", soft: "#EDE8DC" },
  { paper: "#F0EBDF", pure: "#F9F6EE", stone: "#DFD9CB", soft: "#EAE4D4" },
  { paper: "#EDE7D8", pure: "#F7F3E8", stone: "#DBD4C3", soft: "#E6DECC" },
];

const SIGNAL_OPTIONS = ["#1E3A8A", "#16235C", "#0F2A5C", "#2D3F7C", "#3B1E47"];

const HERO_VARIANTS = ["standard", "stacked", "indexed"];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState("home");
  const [lang, setLang] = React.useState("en");
  const [contactOpen, setContactOpen] = React.useState(false);

  const copy = window.COPY[lang];

  React.useEffect(() => {
    const root = document.documentElement;
    const serif = SERIF_STACKS[t.serifFamily] || SERIF_STACKS["Source Serif 4"];
    root.style.setProperty("--serif", serif);
    const warm = PAPER_WARMTH_MAP[Math.max(0, Math.min(4, t.paperWarmth))] || PAPER_WARMTH_MAP[2];
    root.style.setProperty("--paper", warm.paper);
    root.style.setProperty("--paper-pure", warm.pure);
    root.style.setProperty("--stone", warm.stone);
    root.style.setProperty("--stone-soft", warm.soft);
    root.style.setProperty("--signal", t.signalHue);
  }, [t]);

  React.useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
  }, [route]);

  React.useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.replace("#", "");
      if (["home", "services", "about", "resources"].includes(h) || h.startsWith("resource:")) setRoute(h);
    };
    window.addEventListener("hashchange", onHash);
    onHash();
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  React.useEffect(() => {
    if (window.location.hash.replace("#", "") !== route) {
      window.history.replaceState(null, "", `#${route}`);
    }
  }, [route]);

  const onOpenContact = () => setContactOpen(true);

  return (
    <>
      <TopNav route={route} setRoute={setRoute} lang={lang} setLang={setLang}
              onOpenContact={onOpenContact} copy={copy} />
      <main style={{ paddingTop: 0 }}>
        {route === "home" && <HomePage copy={copy} onCta={onOpenContact} heroVariant={t.heroVariant} />}
        {route === "services" && <ServicesPage copy={copy} onCta={onOpenContact} />}
        {route === "about" && <AboutPage copy={copy} onCta={onOpenContact} />}
        {route === "resources" && <ResourcesPage copy={copy} onCta={onOpenContact} lang={lang} setRoute={setRoute} />}
        {route.startsWith("resource:") && <ResourceDetailPage copy={copy} lang={lang} slug={route.slice("resource:".length)} setRoute={setRoute} onCta={onOpenContact} />}
      </main>
      <Footer copy={copy} setRoute={setRoute} onOpenContact={onOpenContact} />
      <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} copy={copy} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Typography" />
        <TweakSelect
          label="Serif family"
          value={t.serifFamily}
          options={Object.keys(SERIF_STACKS)}
          onChange={v => setTweak("serifFamily", v)}
        />

        <TweakSection label="Color" />
        <TweakSlider
          label="Paper warmth"
          value={t.paperWarmth}
          min={0} max={4} step={1}
          onChange={v => setTweak("paperWarmth", v)}
        />
        <div className="twk-row">
          <div className="twk-lbl"><span>Signal hue</span><span className="twk-val">{t.signalHue}</span></div>
          <div style={{ display: "flex", gap: 6 }}>
            {SIGNAL_OPTIONS.map(c => (
              <button key={c} onClick={() => setTweak("signalHue", c)}
                      style={{
                        width: 26, height: 26, borderRadius: 4,
                        background: c,
                        border: t.signalHue === c ? "2px solid #000" : "1px solid rgba(0,0,0,0.15)",
                        cursor: "pointer",
                      }} />
            ))}
          </div>
        </div>

        <TweakSection label="Hero" />
        <TweakRadio
          label="Composition"
          value={t.heroVariant}
          options={HERO_VARIANTS}
          onChange={v => setTweak("heroVariant", v)}
        />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
